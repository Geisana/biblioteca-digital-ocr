<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cadastrar de Documento</title>

<style>
  select{
  padding:12px;
  border:1px solid #ddd;
  border-radius:10px;
  outline:none;
}

select:focus{
  border-color:#8B0000;
  box-shadow:0 0 5px rgba(139,0,0,.3);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, Helvetica, sans-serif;
}

body{
  background:#f2f2f2;
}

/* SIDEBAR */
.sidebar{
  position:fixed;
  width:260px;
  height:100vh;
  background:#8B0000;
  color:white;
  padding:30px 20px;
}

.sidebar h2{
  font-size:20px;
  margin-bottom:40px;
}

.menu{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.menu a{
  color:white;
  text-decoration:none;
  padding:12px;
  border-radius:8px;
  transition:0.3s;
}

.menu a:hover{
  background:rgba(255,255,255,0.15);
}

/* MAIN */
.main{
  margin-left:260px;
  padding:50px;
}

/* TITLE */
.page-title h1{
  color:#8B0000;
  margin-bottom:25px;
}

/* CARD */
.upload-box{
  background:white;
  padding:35px;
  border-radius:16px;
  box-shadow:0 10px 25px rgba(0,0,0,0.08);
  max-width:700px;
}

/* FORM */
form{
  display:flex;
  flex-direction:column;
  gap:15px;
}

/* LABEL */
label{
  font-weight:bold;
  color:#444;
  margin-top:10px;
}

/* INPUTS */
input[type="text"],
input[type="date"],
input[type="file"]{
  padding:12px;
  border:1px solid #ddd;
  border-radius:10px;
  outline:none;
  transition:0.2s;
}

input:focus{
  border-color:#8B0000;
  box-shadow:0 0 5px rgba(139,0,0,0.3);
}

/* FILE AREA */
.file-box{
  border:2px dashed #8B0000;
  padding:25px;
  text-align:center;
  border-radius:12px;
  background:#fff5f5;
  cursor:pointer;
  transition:0.3s;
}

.file-box:hover{
  background:#ffe5e5;
}

/* BUTTON */
button{
  margin-top:10px;
  padding:14px;
  background:#8B0000;
  color:white;
  border:none;
  border-radius:10px;
  font-size:16px;
  cursor:pointer;
  transition:0.3s;
}

button:hover{
  background:#a80000;
  transform:translateY(-2px);
}

/* INFO BOX */
.info{
  margin-top:25px;
  padding:15px;
  background:#fafafa;
  border-left:4px solid #8B0000;
  border-radius:10px;
  color:#555;
  line-height:1.6;
  font-size:14px;
}

</style>

</head>

<body>

<aside class="sidebar">

  <h2>
          Sistema de Acervo Digital

  </h2>

  <nav class="menu">

    <a href="/admin">Dashboard</a>
    <a href="/admin/documentos">
        Documentos
      </a>
    <a href="/admin/upload">Cadastrar Documento</a>
    <a href="/">Site Público</a>

  </nav>

</aside>

<main class="main">

  <div class="page-title">
    <h1>Cadastrar Documento</h1>
  </div>

  <div class="upload-box">

    <form action="/upload" method="POST" enctype="multipart/form-data">

      <label>Título do Documento</label>
      <input type="text" name="titulo" placeholder="Ex: Coletânia Machado De Assis" required>

      <label>Data do Documento</label>
      <input type="date" name="data_documento">

      <label>Autoria</label>
      <input type="text" name="autoria" placeholder="Ex: Autor desconhecido">

      <label>Pipeline de Processamento</label>

          <select name="pipeline" required>

          {% for pipeline in pipelines %}

              <option value="{{ pipeline.codigo }}">

                  {{ pipeline.nome }}

              </option>

          {% endfor %}

          </select>

      <label>Arquivo PDF</label>
      <div class="file-box">
        <input type="file" name="pdf" accept=".pdf" required>
        <p>Clique para selecionar o PDF</p>
      </div>

      <button type="submit">
        🚀 Processar Documento
      </button>

    </form>

    <div class="info">

      <p>✔ OCR automático será executado</p>
      <p>✔ Resumo será gerado por IA</p>
      <p>✔ Documento ficará disponível no acervo</p>

    </div>

  </div>

</main>

</body>

</html>
