<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Login - Sistema De Acervo Digital</title>

<style>

body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(135deg,#8B0000,#300000);
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.box{
  background:white;
  padding:40px;
  border-radius:12px;
  width:320px;
  box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

h2{
  text-align:center;
  color:#8B0000;
  margin-bottom:20px;
}

input{
  width:100%;
  padding:12px;
  margin:10px 0;
  border:1px solid #ddd;
  border-radius:8px;
}

button{
  width:100%;
  padding:12px;
  background:#8B0000;
  color:white;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

button:hover{
  background:#a80000;
}

.error{
  color:red;
  text-align:center;
  margin-bottom:10px;
}

</style>

</head>

<body>

<div class="box">

  <h2>Login - Sistema De Acervo Digital</h2>

  {% if erro %}
    <div class="error">{{ erro }}</div>
  {% endif %}

  <form method="POST">

    <input type="text" name="usuario" placeholder="Usuário" required>

    <input type="password" name="senha" placeholder="Senha" required>

    <button type="submit">Entrar</button>

  </form>

</div>

</body>
</html>
